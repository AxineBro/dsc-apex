version: '3.8'

services:
  backend:
    image: ghcr.io/axinebro/dsc-backend:latest
    container_name: java-backend
    ports:
      - "8081:8080"
    environment:
      - GIGA_CHAT_API_KEY=${GIGA_CHAT_API_KEY}
      - GIGA_CHAT_SCOPE=${GIGA_CHAT_SCOPE:-GIGACHAT_API_PERS}
      - GIGA_CHAT_MODEL=${GIGA_CHAT_MODEL:-GigaChat-Pro}
      - GIGA_CHAT_UNSAFE_SSL=${GIGA_CHAT_UNSAFE_SSL:-true}
      - DB_URL=jdbc:postgresql://db:5432/agentdb
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_DDL_AUTO=${DB_DDL_AUTO:-update}
      - DB_SHOW_SQL=${DB_SHOW_SQL:-false}
      - DB_FORMAT_SQL=${DB_FORMAT_SQL:-true}
      - APP_MAX_CYCLES=${APP_MAX_CYCLES:-5}
      - APP_BATCH_SIZE=${APP_BATCH_SIZE:-5}
      - APP_FLAT_LIMIT=${APP_FLAT_LIMIT:-5}
      - APP_SLOW_THRESHOLD_MS=${APP_SLOW_THRESHOLD_MS:-60000}
      - APP_SLOW_SCORING_THRESHOLD_MS=${APP_SLOW_SCORING_THRESHOLD_MS:-20000}
      - APP_TIMEOUT_REMINDER_WAIT_MINUTES=${APP_TIMEOUT_REMINDER_WAIT_MINUTES:-5}
      - APP_TIMEOUT_SCHEDULER=${APP_TIMEOUT_SCHEDULER:-10}
      - SPRINGDOC_API_DOCS_ENABLED=${SPRINGDOC_API_DOCS_ENABLED:-true}
      - SPRINGDOC_SWAGGER_UI_ENABLED=${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
      - APP_DATA_APARTMENTS=${APP_DATA_APARTMENTS:-data/apartments.json}
      - APP_DATA_COMPLEXES=${APP_DATA_COMPLEXES:-data/complexes.json}
      - APP_OFFER_TEMPLATE=${APP_OFFER_TEMPLATE:-templates/offer_template.txt}
      - APP_SYSTEM_PROMPT=${APP_SYSTEM_PROMPT:-prompts/system_instruction.txt}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    env_file:
      - .env
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/axinebro/dsc-frontend:latest
    container_name: react-frontend
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: ghcr.io/axinebro/dsc-nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
